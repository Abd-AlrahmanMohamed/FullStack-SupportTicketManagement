<h2 mat-dialog-title>Create User</h2>

<mat-dialog-content>
  <p class="dialog-description">Add a new admin, support agent, or customer account.</p>

  <form [formGroup]="form" class="dialog-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Full Name</mat-label>
      <input matInput formControlName="fullName" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Password</mat-label>
      <input matInput type="password" formControlName="password" />
      <mat-hint>At least 6 characters.</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Role</mat-label>
      <mat-select formControlName="role">
        <mat-option value="Admin">Admin</mat-option>
        <mat-option value="SupportAgent">Support Agent</mat-option>
        <mat-option value="Customer">Customer</mat-option>
      </mat-select>
    </mat-form-field>

    @if (errorMessage()) {
      <div class="form-error" role="alert">{{ errorMessage() }}</div>
    }
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()" [disabled]="submitting()">Cancel</button>
  <button mat-flat-button color="primary" type="button" (click)="submit()" [disabled]="submitting()">
    @if (submitting()) {
      <mat-spinner diameter="18"></mat-spinner>
    } @else {
      Create User
    }
  </button>
</mat-dialog-actions>
